<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Geospec</title>
     <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"rel="stylesheet"/>
      <!-- Custom CSS -->
    <link rel="stylesheet" href="geo.css" />
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
</head>
<body>
  <div class="row vh-100 g-0">
    <!-- left sidebar -->
     <div class="col-lg-6 position-relative d-none d-lg-block">
      <div class="bg-holder" style="background-image: url(images/geospec.png);"></div>
     </div>
    <!-- right content -->
     <div class="col-lg-6">
      <div class="row align-items-center justify-content-center h-100 g-0 px-4 px-sm-0">
        <div class="col col-sm-6 col-lg-7 col-xl-6">
          <!-- Login content goes here -->
           <a href="#" class="d-flex justify-content-center mb-4">
           <img src="images/logo.png" alt="" width="60">
          </a>

          <div class="text-center mb-5">
            <h3 class="fw-bold">Log In</h3>
            <p class="text-secondary">Get access to your account</p>
          </div>

          <!-- Social Login -->
           <button class="btn btn-outline-secondary btn-outline-custom btn-lg w-100 me-1 mb-3">
            <i class="bx bxl-google text-danger me-1 fs-6"></i>
            Login with Google
           </button>
           <button class="btn btn-outline-secondary btn-outline-custom btn-lg mb-3 me-1 w-100">
            <i class="bx bxl-facebook text-primary me-1 fs-6"></i>
            Login with Facebook
           </button>
            <!--divider  -->
            <div class="position-relative">
              <hr class="text-secondary divider">
              <div class="divider-content-center">
                Or
              </div>
            </div>
            <!-- form -->
             <form action="#">
              <div class="input-group mb-3">
                <span class="input-group-text">
                  <i class="bx bx-user"></i>
                </span>
                <input type="text" class="form-control form-control-lg fs-6" placeholder="username">
              </div>
               <div class="input-group mb-3">
                <span class="input-group-text">
                  <i class="bx bx-lock-alt"></i>
                </span>
                <input type="password" class="form-control form-control-lg fs-6" placeholder="password">
              </div>
              <div class="input-group mb-3 d-flex justify-content-between">
                <div class="form-check">
                  <input type="checkbox" class="form-check-input" id="formcheck">
                  <label for="formcheck" class="form-check-label text-secondary"><small>Remember me</small></label>
                </div>
                <div>
                  <small><a href="#">Forgot Password</a></small>
                </div>
                <button class="btn btn-primary btn-lg w-100 mb-3">Login</button>
              </div>
             </form>
             <div class="text-center">
              <small>Don't have an account?<a href="#" class="fw-bold">Sign Up</a></small>
             </div>
        </div>
      </div>
     </div>
  </div>

   <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
